<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>GeoCharge for Tesla</title>
  <!-- Theme before first paint. Inline and blocking on purpose: run from the
       module later, a driver on the light theme would get a dark flash on every
       load. Dark stays the default; without a stored choice we follow the car's
       own day/night setting where the browser reports it. -->
  <script>
    (function () {
      var t = 'dark';
      try {
        t = localStorage.getItem('gc_theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches
            ? 'light' : 'dark';
        }
      } catch (e) { t = 'dark'; }
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <meta name="description" content="EV chargers across Georgia with live status — built for the Tesla in-car browser.">
  <link rel="icon" type="image/svg+xml" href="assets/mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://unpkg.com/@googlemaps/markerclusterer@2.5.3/dist/index.min.js"></script>
</head>
<body>
  <header class="topbar">
    <button id="btn-home" class="topbar__brand" type="button" data-t-title="reloadHint">
      <img src="assets/mark.svg" alt="" class="topbar__mark">
      <span class="topbar__title">GeoCharge <span class="accent" data-t="forTesla"></span></span>
    </button>
    <span id="access-badge" class="badge is-hidden"></span>
    <span id="station-count" class="topbar__count"></span>
    <div class="topbar__actions">
      <button id="btn-trip" class="btn" data-t="trip"></button>
      <button id="btn-filters" class="btn" data-t="filters"></button>
      <div class="country-select">
        <button id="btn-countries" class="btn btn--flags" aria-haspopup="true" aria-expanded="false">
          <span id="country-label" class="country-flags"></span>
        </button>
        <div id="country-menu" class="country-menu is-hidden" role="menu"></div>
      </div>
      <!-- Saved places. The map carries the same list as one-tap buttons; this
           is where they are renamed and removed. -->
      <div class="fav-select">
        <button id="btn-favs" class="btn btn--icon" type="button" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 17.3l-6.18 3.7 1.64-7.03L2 9.24l7.19-.62L12 2l2.81 6.62 7.19.62-5.46 4.73L18.18 21z"/></svg>
        </button>
        <div id="fav-menu" class="country-menu fav-menu is-hidden" role="menu"></div>
      </div>
      <!-- The driver's own car: model + colour, drawn live into the button. -->
      <div class="car-select">
        <button id="btn-car" class="btn btn--icon btn--car" type="button" aria-haspopup="true" aria-expanded="false">
          <span id="car-badge" class="car-badge"></span>
        </button>
        <div id="car-menu" class="country-menu car-menu is-hidden" role="menu"></div>
      </div>
      <button id="btn-theme" class="btn btn--icon" type="button">
        <svg class="theme-toggle__sun" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 17a5 5 0 110-10 5 5 0 010 10zm0-13.5a1 1 0 011 1V6a1 1 0 01-2 0V4.5a1 1 0 011-1zm0 15a1 1 0 011 1v1.5a1 1 0 01-2 0V19.5a1 1 0 011-1zM4.5 11H6a1 1 0 010 2H4.5a1 1 0 010-2zm13.5 0h1.5a1 1 0 010 2H18a1 1 0 010-2zM6.2 4.8l1.1 1.1a1 1 0 01-1.4 1.4L4.8 6.2a1 1 0 011.4-1.4zm10.5 10.5l1.1 1.1a1 1 0 01-1.4 1.4l-1.1-1.1a1 1 0 011.4-1.4zm2.5-10.5a1 1 0 010 1.4l-1.1 1.1a1 1 0 01-1.4-1.4l1.1-1.1a1 1 0 011.4 0zM7.3 15.3a1 1 0 010 1.4l-1.1 1.1a1 1 0 01-1.4-1.4l1.1-1.1a1 1 0 011.4 0z"/></svg>
        <svg class="theme-toggle__moon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M21 13.2A9 9 0 1110.8 3a7.2 7.2 0 1010.2 10.2z"/></svg>
      </button>
      <div class="lang-switch">
        <button class="lang-switch__btn" data-lang-btn="ka">ქა</button>
        <button class="lang-switch__btn" data-lang-btn="en">EN</button>
      </div>
      <button id="btn-logout" class="btn btn--ghost is-hidden" data-t="logout"></button>
    </div>
  </header>

  <main class="stage">
    <div id="map"></div>

    <div id="loading" class="loading"><span data-t="loading"></span></div>

    <!-- Past trips. Left of the search field rather than right: the saved
         places rail is on the right, and at 1000px the two would collide. -->
    <button id="btn-history" class="map-pill" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M13 3a9 9 0 00-9 9H1l3.9 3.9.1.1L9 12H6a7 7 0 117 7 6.9 6.9 0 01-4.9-2l-1.4 1.4A9 9 0 1013 3zm-1 5v5l4.3 2.5.7-1.2-3.5-2.1V8z"/></svg>
      <span data-t="historyBtn"></span>
    </button>

    <!-- Search (stations + destinations) -->
    <div id="search-box">
      <div class="search-bar">
        <span class="search-bar__ico">🔍</span>
        <input id="search-input" type="text" autocomplete="off" data-t-placeholder="searchPlaceholder">
        <button id="search-clear" class="search-bar__clear" hidden aria-label="Clear">✕</button>
      </div>
      <div id="search-results"></div>
    </div>

    <!-- Saved places as one-tap navigation, top-right of the map. Empty until
         the driver stars something, and hidden while driving (the turn banner
         reaches this far on a narrow in-car screen). -->
    <div id="fav-rail" class="fav-rail"></div>

    <!-- Map controls. One bottom-right column: everything the driver can press
         over the map lives here, so nothing can land on top of anything else.
         The zoom pair is ours rather than the Maps API's, which drew itself in
         the same corner (and drew it small). -->
    <div class="map-controls">
      <!-- Drive mode only, and only once the driver has dragged the map off the car. -->
      <button id="drive-recenter" class="drive-recenter is-hidden" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 100 8 4 4 0 000-8zm8.94 3a8.994 8.994 0 00-7.94-7.94V1h-2v2.06A8.994 8.994 0 003.06 11H1v2h2.06A8.994 8.994 0 0011 20.94V23h2v-2.06A8.994 8.994 0 0020.94 13H23v-2h-2.06zM12 19a7 7 0 110-14 7 7 0 010 14z"/></svg>
        <span data-t="driveRecenter"></span>
      </button>
      <button id="btn-traffic" class="map-ctrl" aria-label="Traffic" title="Traffic">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2a3 3 0 00-3 3v14a3 3 0 006 0V5a3 3 0 00-3-3zm0 3a1 1 0 011 1 1 1 0 01-2 0 1 1 0 011-1zm0 5a1 1 0 011 1 1 1 0 01-2 0 1 1 0 011-1zm0 5a1 1 0 011 1 1 1 0 01-2 0 1 1 0 011-1z"/></svg>
      </button>
      <button id="btn-locate" class="map-ctrl" aria-label="My location">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 8a4 4 0 100 8 4 4 0 000-8zm8.94 3a8.994 8.994 0 00-7.94-7.94V1h-2v2.06A8.994 8.994 0 003.06 11H1v2h2.06A8.994 8.994 0 0011 20.94V23h2v-2.06A8.994 8.994 0 0020.94 13H23v-2h-2.06zM12 19a7 7 0 110-14 7 7 0 010 14z"/></svg>
      </button>
      <div class="map-zoom">
        <button id="btn-zoom-in" class="map-ctrl" data-t-aria="zoomIn" data-t-title="zoomIn">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M11 5h2v14h-2zM5 11h14v2H5z"/></svg>
        </button>
        <button id="btn-zoom-out" class="map-ctrl" data-t-aria="zoomOut" data-t-title="zoomOut">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M5 11h14v2H5z"/></svg>
        </button>
      </div>
    </div>

    <!-- Destination action card (after picking a searched place) -->
    <div id="dest-card" class="dest-card is-hidden">
      <button id="dest-close" class="panel__close" aria-label="Close">✕</button>
      <div class="dest-card__name"></div>
      <div class="dest-card__actions">
        <button id="dest-nav" class="btn btn--primary" data-t="navigate"></button>
        <button id="dest-route" class="btn" data-t="planRouteHere"></button>
      </div>
    </div>

    <!-- Station details -->
    <aside id="station-panel" class="panel">
      <button id="panel-close" class="panel__close" aria-label="Close">✕</button>
      <div class="panel__head">
        <img class="panel__logo" alt="" hidden>
        <div>
          <h2 class="panel__name"></h2>
          <p class="panel__provider"></p>
        </div>
      </div>
      <span class="panel__status"></span>
      <div class="panel__meta">
        <div><span class="label" data-t="power"></span><span class="panel__power"></span></div>
        <div><span class="label" data-t="price"></span><span class="panel__price"></span></div>
      </div>
      <h3 class="panel__ports-title" data-t="ports"></h3>
      <div class="panel__ports"></div>
      <div class="panel__freshness">
        <div class="panel__freshness-text">
          <p class="panel__updated"></p>
          <p class="panel__source"></p>
        </div>
        <button class="panel__refresh" type="button" hidden>
          <svg class="panel__refresh-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0012 4a8 8 0 108 8h-2.1A5.9 5.9 0 1112 6.1c1.63 0 3.1.66 4.17 1.73L13 11h7V4l-2.35 2.35z"/>
          </svg>
          <span class="panel__refresh-label"></span>
        </button>
      </div>
      <p class="panel__refresh-note"></p>
      <button class="btn btn--primary btn--wide panel__nav" data-t="navigate"></button>
    </aside>

    <!-- Filters -->
    <aside id="filter-drawer" class="drawer">
      <div class="drawer__head">
        <h2 data-t="filters"></h2>
        <button id="filter-close" class="panel__close" aria-label="Close">✕</button>
      </div>
      <h3 class="drawer__label" data-t="status"></h3>
      <div class="chip-row">
        <button id="filter-dc" class="btn btn--toggle" data-t="fastDcOnly"></button>
        <button id="filter-avail" class="btn btn--toggle" data-t="availableOnly"></button>
      </div>
      <h3 class="drawer__label" data-t="minPower"></h3>
      <div id="filter-powers" class="chip-row"></div>
      <h3 class="drawer__label" data-t="provider"></h3>
      <div id="filter-providers" class="chip-row"></div>
      <h3 class="drawer__label" data-t="connector"></h3>
      <div id="filter-connectors" class="chip-row"></div>
      <div class="drawer__foot">
        <button id="filter-clear" class="btn btn--ghost" data-t="clearFilters"></button>
      </div>
    </aside>

    <!-- Trip planner -->
    <aside id="trip-drawer" class="drawer">
      <div class="drawer__head">
        <h2 data-t="trip"></h2>
        <button id="trip-close" class="panel__close" aria-label="Close">✕</button>
      </div>

      <div id="trip-stops"></div>
      <button id="trip-add-stop" class="btn btn--ghost trip-add">
        <span>＋</span> <span data-t="addStop"></span>
      </button>

      <h3 class="drawer__label" data-t="connector"></h3>
      <div id="trip-connectors" class="chip-row"></div>
      <h3 class="drawer__label" data-t="minPower"></h3>
      <div id="trip-powers" class="chip-row"></div>

      <div class="trip-params">
        <label class="trip-param">
          <span class="label"><span data-t="tripBatteryNow"></span> <b id="trip-battery-val">80%</b></span>
          <input id="trip-battery" type="range" min="5" max="100" step="5" value="80">
        </label>
        <label class="trip-param">
          <span class="label" data-t="tripRange"></span>
          <input id="trip-range" type="number" class="input input--small" min="80" max="800" value="300">
        </label>
      </div>

      <div id="trip-preview" class="trip-summary"></div>
      <p id="trip-warning" class="gate__error is-hidden" data-t="tripUnreachable"></p>

      <h3 id="trip-options-title" class="drawer__label is-hidden" data-t="chargersOnRoute"></h3>
      <div id="trip-options"></div>

      <button id="trip-nav" class="btn btn--primary btn--wide trip-nav" data-t="startNav" disabled></button>
      <button id="trip-save" class="btn btn--wide trip-save" data-t="routeSaveBtn" disabled></button>
      <button id="trip-clear-route" class="btn btn--ghost btn--wide trip-clear" data-t="tripClearRoute"></button>
    </aside>

    <!-- Turn-by-turn drive mode (in-browser navigation) -->
    <div id="drive" class="drive is-hidden">
      <div id="drive-banner" class="drive-banner">
        <div id="drive-icon" class="drive-banner__icon"></div>
        <div class="drive-banner__txt">
          <div id="drive-dist" class="drive-banner__dist"></div>
          <div id="drive-road" class="drive-banner__road"></div>
        </div>
      </div>
      <div id="drive-reroute" class="drive-reroute is-hidden" data-t="driveRerouting"></div>
      <div class="drive-foot">
        <div class="drive-foot__stats">
          <span id="drive-remain"></span>
          <span id="drive-eta"></span>
        </div>
        <button id="drive-voice" class="drive-foot__btn" aria-label="Voice"></button>
        <button id="drive-exit" class="btn btn--primary drive-foot__exit" data-t="driveEnd"></button>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- One-time onboarding hint (first granted visit) -->
    <div id="onboard" class="onboard is-hidden">
      <div class="onboard__card">
        <h3 data-t="onboardTitle"></h3>
        <ul>
          <li data-t="onboardFullscreen"></li>
          <li data-t="onboardBookmark"></li>
        </ul>
        <button id="onboard-ok" class="btn btn--primary" data-t="onboardOk"></button>
      </div>
    </div>

    <!-- What "live status not published" means on a plug. Reuses the onboarding
         overlay's look so there is one modal style in the app. -->
    <div id="port-info" class="onboard is-hidden">
      <div class="onboard__card">
        <h3 id="port-info-title"></h3>
        <div id="port-info-body" class="onboard__body"></div>
        <button id="port-info-ok" class="btn btn--primary" data-t="onboardOk"></button>
      </div>
    </div>

    <!-- An unfinished trip, offered once per session. The driver stopped in
         Gori and switched the car off; this is how they carry on. -->
    <div id="resume-card" class="dest-card resume-card is-hidden">
      <div class="resume-card__label" data-t="resumeTitle"></div>
      <div class="resume-card__name"></div>
      <div class="resume-card__sub"></div>
      <div class="dest-card__actions">
        <button id="resume-go" class="btn btn--primary" data-t="routeContinue"></button>
        <button id="resume-dismiss" class="btn btn--ghost" data-t="favCancel"></button>
      </div>
    </div>

    <!-- Past trips, newest first. Everything that became a real trip is here
         without the driver filing anything. -->
    <div id="history-panel" class="onboard is-hidden">
      <div class="onboard__card history-card">
        <div class="drawer__head">
          <h2 data-t="historyTitle"></h2>
          <button id="history-close" class="panel__close" aria-label="Close">✕</button>
        </div>
        <div id="history-list" class="history-list"></div>
      </div>
    </div>

    <!-- A route sent from the phone. Waits here until the driver deals with
         it, so one sent from the sofa is still on offer at the car. -->
    <div id="inbox-card" class="dest-card resume-card is-hidden">
      <div class="resume-card__label" data-t="inboxTitle"></div>
      <div class="resume-card__name"></div>
      <div class="resume-card__sub"></div>
      <div class="dest-card__actions">
        <button id="inbox-go" class="btn btn--primary" data-t="navigate"></button>
        <!-- A single place sent from the phone ("here is the hotel") gets a
             fourth action: plan the way there, chargers and all. Hidden for a
             route, which already is a plan. -->
        <button id="inbox-plan" class="btn is-hidden" data-t="planRouteHere"></button>
        <button id="inbox-save" class="btn" data-t="favSave"></button>
        <button id="inbox-dismiss" class="btn btn--ghost" data-t="favCancel"></button>
      </div>
    </div>

    <!-- Naming a favourite or a route -->
    <div id="fav-dialog" class="onboard is-hidden">
      <div class="onboard__card fav-dialog">
        <h3 id="fav-dialog-title"></h3>
        <p id="fav-dialog-place" class="fav-dialog__place"></p>
        <input id="fav-name" class="input" type="text" maxlength="32" autocomplete="off">
        <div id="fav-icons" class="fav-icons"></div>
        <div class="fav-dialog__actions">
          <button id="fav-cancel" class="btn btn--ghost" data-t="favCancel"></button>
          <button id="fav-save" class="btn btn--primary" data-t="favSave"></button>
        </div>
      </div>
    </div>

    <!-- Login (blocks the app until signed in) -->
    <section id="login-screen" class="gate">
      <div class="gate__card">
        <img src="assets/logo-dark.svg" alt="GeoCharge" class="gate__logo">
        <h2 data-t="signInTitle"></h2>
        <p class="gate__subtitle" data-t="signInSubtitle"></p>

        <!-- Pairing: the car shows a code, the phone app approves it. Default
             way in, because most accounts were made with Google and have no
             password to type. -->
        <div id="pair-box" class="pair is-hidden">
          <div id="pair-code" class="pair__code">· · ·</div>
          <p id="pair-timer" class="pair__timer"></p>
          <ol class="pair__steps">
            <li data-t="pairStep1"></li>
            <li data-t="pairStep2"></li>
            <li data-t="pairStep3"></li>
          </ol>
          <p id="pair-error" class="gate__error is-hidden"></p>
          <button id="pair-refresh" class="btn btn--wide is-hidden" data-t="pairRefresh"></button>
        </div>
        <button id="show-classic" class="gate__link is-hidden" type="button" data-t="otherSignIn"></button>

        <div id="classic-login">
        <form id="login-form">
          <input id="login-email" type="email" class="input" autocomplete="email" required data-t-placeholder="email">
          <input id="login-password" type="password" class="input" autocomplete="current-password" required data-t-placeholder="password">
          <p id="login-error" class="gate__error is-hidden"></p>
          <button type="submit" class="btn btn--primary btn--wide" data-t="signInBtn"></button>
        </form>
        <div class="gate__divider"><span data-t="orDivider"></span></div>
        <button id="btn-google" class="btn btn--wide">
          <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6C12.3 13.4 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.4 28.8a14.5 14.5 0 0 1 0-9.6l-7.8-6a24 24 0 0 0 0 21.6l7.8-6z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.4-5.6l-7.5-5.8c-2.1 1.4-4.8 2.3-7.9 2.3-6.3 0-11.7-3.9-13.6-9.6l-7.8 6C6.5 42.6 14.6 48 24 48z"/></svg>
          <span data-t="googleBtn"></span>
        </button>
        </div><!-- /classic-login -->
        <p class="gate__note" data-t="noAccount"></p>
        <p class="gate__note gate__note--price" data-t="signInPrice"></p>
      </div>
    </section>

    <!-- Paywall (trial expired, not premium) -->
    <section id="paywall-screen" class="gate">
      <div class="gate__card gate__card--wide">
        <img src="assets/logo-dark.svg" alt="GeoCharge" class="gate__logo">
        <h2 data-t="paywallTitle"></h2>
        <p class="gate__subtitle" data-t="paywallBody"></p>
        <div class="paywall__row">
          <ol class="paywall__steps">
            <li data-t="paywallStep1"></li>
            <li data-t="paywallStep2"></li>
            <li data-t="paywallStep3"></li>
          </ol>
          <div class="paywall__qr">
            <div id="qr"></div>
            <span class="gate__note" data-t="paywallQr"></span>
          </div>
        </div>
        <p class="gate__note"><span id="user-email"></span></p>
        <button id="btn-logout-paywall" class="btn btn--ghost" data-t="logout"></button>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
