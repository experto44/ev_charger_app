name: Probe EPDK filters

# TEMPORARY. `{"hizmetSekli":"HALKA_ACIK"}` is the query that enumerates the
# registry (12,903 public stations, ~11.9 MB), but the rows are not under
# `result`, so this dumps the envelope to find where they actually live.
# Delete this file once build_turkey.py parses the real shape.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query and describe the envelope
        run: |
          code=$(curl -sS -m 300 -X GET \
            -H 'Content-Type: application/json' \
            -d '{"hizmetSekli":"HALKA_ACIK"}' \
            'https://apigateway.epdk.gov.tr/sarjIstasyonlari' \
            -o out.json -w '%{http_code}')
          echo "http: $code  bytes: $(wc -c < out.json)"
          python3 - <<'PY'
          import json
          d = json.load(open("out.json", encoding="utf-8"))
          if "fault" in d:
              print("FAULT:", d["fault"]); raise SystemExit
          print("TOP-LEVEL KEYS:")
          for k, v in d.items():
              kind = type(v).__name__
              size = len(v) if isinstance(v, (list, dict, str)) else v
              print(f"  {k}: {kind} = {size}")
          # Find the key that actually holds the rows.
          for k, v in d.items():
              if isinstance(v, list) and v:
                  print(f"\nROWS UNDER {k!r}, first entry:")
                  print(json.dumps(v[0], ensure_ascii=False)[:2000])
                  break
          else:
              print("\nNo non-empty list at the top level; raw head:")
              print(open("out.json", encoding="utf-8").read()[:2000])
          PY
