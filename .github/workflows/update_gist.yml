name: Update Chargers Gist

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  schedule:
    # Request a run every 5 minutes (GitHub's documented minimum). NOTE: the
    # `schedule` event is best-effort — GitHub throttles/drops it under load, so
    # in practice it fires anywhere from every few minutes to once an hour. We
    # do NOT rely on this cadence alone; each run loops internally (see the
    # "Push chargers.json to Gist" step) to keep data fresh between fires, and
    # an external pinger can hit workflow_dispatch for true 5-min reliability
    # (see README / the note at the bottom of this file).
    - cron: '*/5 * * * *'

  # Also fire immediately whenever chargers.json is committed to main
  push:
    branches: [main]
    paths:
      - 'assets/data/chargers.json'

  # Allow a manual run from the Actions tab, or an external scheduler hitting
  # the REST API: POST /repos/{owner}/{repo}/actions/workflows/update_gist.yml/dispatches
  workflow_dispatch:

# Whenever a new run starts (scheduled fire, push, or dispatch), cancel any
# still-looping previous run so the newest one takes over cleanly. This makes
# the internal loop self-adapting: frequent fires => short runs; rare fires =>
# the loop fills the gap. Only one updater touches the gist at a time.
concurrency:
  group: update-gist
  cancel-in-progress: true

# ── Job ───────────────────────────────────────────────────────────────────────
jobs:
  update-gist:
    runs-on: ubuntu-latest
    # Safety ceiling under GitHub's 6h hard limit; the loop targets ~5.5h so a
    # single fire keeps the gist fresh for hours (see the refresh loop below).
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pycognito firebase-admin

      - name: Push chargers.json to Gist
        env:
          GIST_TOKEN:         ${{ secrets.GIST_TOKEN }}
          PLUGSHUB_PHONE:      ${{ secrets.PLUGSHUB_PHONE }}
          PLUGSHUB_PASSWORD:   ${{ secrets.PLUGSHUB_PASSWORD }}
          PLUGSHUB_TENANT_ID:  ${{ secrets.PLUGSHUB_TENANT_ID }}
          GADATENE_PHONE:      ${{ secrets.GADATENE_PHONE }}
          GADATENE_PASSWORD:   ${{ secrets.GADATENE_PASSWORD }}
          ECOCARS_USERNAME:    ${{ secrets.ECOCARS_USERNAME }}
          ECOCARS_PASSWORD:    ${{ secrets.ECOCARS_PASSWORD }}
          # Firebase Admin service-account JSON (single line). Enables the
          # "charger freed up" push alerts; if unset, alerts are silently skipped.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # ── Internal refresh loop ──────────────────────────────────────────
          # GitHub's `schedule` event is unreliable: throttled to as little as
          # once/hour, and disabled entirely after 60 days of repo inactivity.
          # So we do NOT depend on frequent fires — one run loops for ~5.5h
          # (nearly the full 6h job budget), updating every 3 min, so a single
          # fire (scheduled OR manual workflow_dispatch) keeps the gist fresh
          # for hours. cancel-in-progress (top of file) lets a newer fire
          # preempt this run cleanly, so frequent fires still take over fast.
          SLEEP_SECONDS=180      # update cadence — matches the app's 3-min poll
          RUN_SECONDS=19800      # ~5.5h of coverage per fire (well under 6h limit)
          START=$(date +%s)
          i=1
          FAILS=0                 # consecutive failed iterations
          MAX_FAILS=5             # fail the whole run only after this many in a row
          while :; do
          echo "::group::Update iteration $i (elapsed $(( $(date +%s) - START ))s)"
          # One update attempt. A *transient* failure (a slow/blip gist API call,
          # a network hiccup) must NOT kill this multi-hour run — log it and retry
          # on the next tick. A *persistent* failure (e.g. a dead token/secret:
          # MAX_FAILS iterations in a row) still exits non-zero so the run turns
          # red and notifies us, instead of staying silently green forever.
          if python3 << 'PYEOF'
          import json, os, re, requests, time
          from datetime import datetime, timezone

          GIST_ID = "36f39392ce7a4abe14ab065aa8e846bd"
          token   = os.environ["GIST_TOKEN"]
          headers = {
              "Authorization": f"token {token}",
              "Accept":        "application/vnd.github+json",
          }

          # ── AMPECO platform live fetch (mart EV, Electrify Georgia, …) ──────
          # AMPECO public app API: no OAuth needed. GET /app/pins lists every
          # location id; GET /app/locations/{id} returns full detail with the
          # location's evses, connectors and the referenced tariffs/currencies.
          # Multiple Georgian networks run identical AMPECO instances — only the
          # host differs — so one parameterized fetcher serves all of them.
          def fetch_ampeco(host, provider_name, id_prefix, city_fn=None):
              base = f"https://{host}/api/v1"
              common = {
                  "Accept": "application/json",
                  "Accept-Language": "ka",
                  "App-Version": "3.130.0",
                  "X-Internal-App-Version": "3.130.0",
              }

              # 1) Discover all location ids from the lightweight pins endpoint.
              pr = requests.get(f"{base}/app/pins", headers=common, timeout=60)
              pr.raise_for_status()
              pj = pr.json()
              pin_list = pj.get("pins", []) if isinstance(pj, dict) else pj
              ids = [p.get("id") for p in pin_list
                     if isinstance(p, dict) and p.get("id") is not None]

              # connector normalization -> app filter chips (CCS1, CCS2, GB/T, CHAdeMO, Type 2, NACS)
              CONN_MAP = {
                  "ccs": "CCS2", "ccs2": "CCS2", "combo2": "CCS2", "iec62196t2combo": "CCS2",
                  "ccs1": "CCS1", "combo1": "CCS1",
                  "chademo": "CHAdeMO",
                  "type2": "Type 2", "mennekes": "Type 2", "iec62196t2": "Type 2",
                  "type1": "Type 1", "j1772": "Type 1",
                  # GB/T (Chinese GuoBiao). Live API uses icon "gb-t-dc" / name
                  # "GB/T DC", which normalizes to "gbtdc"; cover AC + name variants too.
                  "gbt": "GB/T", "gb_t": "GB/T", "gbtdc": "GB/T", "gbtac": "GB/T",
                  "gbtdccable": "GB/T", "chinese": "GB/T", "gbtgb": "GB/T",
                  "nacs": "NACS", "tesla": "NACS",
              }
              def norm_conn(t):
                  if not t: return None
                  k = str(t).lower().replace(" ", "").replace("-", "").replace("_", "").replace("/", "")
                  return CONN_MAP.get(k)

              def fmt_amt(v):
                  try:
                      f = float(v)
                  except Exception:
                      return None
                  return f"{f:.2f}".rstrip("0").rstrip(".")

              # Resolve a per-kWh price string from the evse's tariffId against the
              # top-level tariffs[] / currencies[] arrays returned alongside the location.
              def tariff_price(tid, tariffs, currencies):
                  t = tariffs.get(str(tid))
                  if not isinstance(t, dict):
                      return ""
                  ppk = t.get("priceForEnergy")
                  if ppk is None: ppk = t.get("priceForEnergyAtDay")
                  if ppk is None: ppk = t.get("priceForEnergyAtNight")
                  a = fmt_amt(ppk) if ppk is not None else None
                  cur = currencies.get(t.get("currencyCode")) or {}
                  sign = cur.get("sign") or cur.get("prefix") or "₾"
                  return f"{a} {sign}/kWh" if a else ""

              # AMPECO address strings look like "<street>, <city> <postcode>, <country>".
              def derive_city(addr):
                  parts = [p.strip() for p in (addr or "").split(",") if p.strip()]
                  if len(parts) >= 3:
                      cand = parts[-2]
                  elif parts:
                      cand = parts[0]
                  else:
                      return ""
                  toks = [t for t in cand.split() if not any(ch.isdigit() for ch in t)]
                  return " ".join(toks).replace("T'bilisi", "Tbilisi").strip()

              stations = []
              for loc_id in ids:
                  try:
                      r = requests.get(f"{base}/app/locations/{loc_id}", headers=common, timeout=60)
                      r.raise_for_status()
                      body = r.json()
                  except Exception as e:
                      print(provider_name, "location", loc_id, "error:", e)
                      continue

                  tariffs    = {str(t.get("id")): t for t in (body.get("tariffs") or []) if isinstance(t, dict)}
                  currencies = {c.get("code"): c for c in (body.get("currencies") or []) if isinstance(c, dict)}

                  for loc in (body.get("locations") or []):
                      coords = str(loc.get("location") or "")
                      if "," not in coords:
                          continue
                      try:
                          lat, lng = [float(x) for x in coords.split(",")[:2]]
                      except Exception:
                          continue

                      # avail / total count PORTS (connectors), not chargers, so
                      # a location with 4 plugs reports "x of 4" correctly.
                      # port_details holds one {type,status,since?} per connector
                      # so the app can colour each plug (free/busy/out) and show
                      # how long a busy one has been charging.
                      conns, max_power, avail, total, any_dc, price = set(), 0.0, 0, 0, False, ""
                      port_details = []
                      SESSION = ("charging", "preparing", "finishing", "occupied",
                                 "reserved", "suspendedev", "suspendedevse",
                                 "inuse", "intransaction")
                      for zone in (loc.get("zones") or []):
                          for e in (zone.get("evses") or []):
                              cs = e.get("connectors") or []
                              ports = max(len(cs), 1)        # an EVSE has >=1 plug
                              total += ports
                              # A spot is free if the platform says isAvailable,
                              # OR its status is exactly "unavailable". On a
                              # dual-connector DC cabinet (CCS2 + GB/T sharing one
                              # power module) AMPECO marks the idle sibling
                              # status=unavailable / isAvailable=false while the
                              # other charges, which made a station with ONE car
                              # charging read "0 of 2". Verified on the live API
                              # that status=unavailable never appears without a
                              # concurrent charging session at the same location,
                              # so it always means "sibling busy", never a broken
                              # unit (those report "out of order"). Counting it
                              # back fixes the bug without masking broken plugs.
                              st = str(e.get("status") or "").strip().lower()
                              is_free = bool(e.get("isAvailable")) or st == "unavailable"
                              if is_free:
                                  avail += ports
                              # Per-plug status for the detail sheet. "unavailable"
                              # (sibling busy) shows as free, matching the count.
                              if is_free:
                                  pstatus = "free"
                              elif st in SESSION:
                                  pstatus = "busy"
                              else:
                                  pstatus = "out"
                              since = e.get("startedAt") if pstatus == "busy" else None
                              try: max_power = max(max_power, float(e.get("maxPower") or 0))
                              except: pass
                              if str(e.get("currentType", "")).lower() == "dc":
                                  any_dc = True
                              for c in cs:
                                  ic = str(c.get("icon") or "").lower()
                                  ct = norm_conn(c.get("icon") or c.get("name"))
                                  if ct: conns.add(ct)
                                  if "ccs" in ic or "chademo" in ic or "gb-t-dc" in ic:
                                      any_dc = True
                                  port = {"type": ct or (c.get("name") or "?"), "status": pstatus}
                                  if since:
                                      port["since"] = since
                                  port_details.append(port)
                              if not price:
                                  price = tariff_price(e.get("tariffId"), tariffs, currencies)

                      kw = round(max_power / 1000) if max_power > 1000 else round(max_power)
                      addr = loc.get("address") or ""
                      name = loc.get("name") or addr or provider_name
                      stations.append({
                          "id": f"{id_prefix}_{loc.get('id')}",
                          "name": name,
                          "lat": lat,
                          "lng": lng,
                          "power": (f"{int(kw)} kW" if kw else "—"),
                          "type": "Fast DC" if any_dc else "AC",
                          "price": price,
                          "available_spots": f"{avail} available",
                          "total_spots": total,
                          "city": (city_fn(addr) if city_fn else derive_city(addr)) or name.split(",")[0],
                          "provider": provider_name,
                          "connectors": sorted(conns),
                          "ports": port_details,
                          "last_updated": "Just now",
                      })
              print(f"{provider_name}: {len(stations)} stations")
              return stations

          def fetch_martev():
              return fetch_ampeco("cp.martev.io", "mart EV", "martev")

          def fetch_electrify():
              return fetch_ampeco("cp.electrify.ge", "Electrify Georgia", "electrify")

          def fetch_evpower():
              return fetch_ampeco("cp.evpower.ge", "EV Power GE", "evpower")

          # MOVEO (cp.moveo.ge) is AMPECO too, but its addresses are Georgian and
          # "|"-separated (e.g. "ვაჟა-ფშაველას გამზ. 70 | თბილისი 0186, საქართველო"),
          # which the comma-only derive_city mangles. Pull the city from the 4-digit
          # postal-code segment and map the common GE city names (and declined
          # roots like "ქარელის") to English so it matches the app's data style.
          def fetch_moveo():
              GE_CITY = {
                  "თბილისი": "Tbilisi", "ბათუმი": "Batumi", "ქუთაისი": "Kutaisi",
                  "რუსთავი": "Rustavi", "გორი": "Gori", "თელავი": "Telavi",
                  "ზუგდიდი": "Zugdidi", "ფოთი": "Poti", "ოზურგეთი": "Ozurgeti",
                  "ახალციხე": "Akhaltsikhe", "მცხეთა": "Mtskheta", "ბორჯომი": "Borjomi",
                  "ბაკურიანი": "Bakuriani", "გუდაური": "Gudauri", "მარნეული": "Marneuli",
                  "ხაშური": "Khashuri", "ზესტაფონი": "Zestaponi", "სენაკი": "Senaki",
              }
              GE_ROOT = {
                  "ქარელ": "Kareli", "თბილის": "Tbilisi", "ბათუმ": "Batumi",
                  "ქუთაის": "Kutaisi", "რუსთავ": "Rustavi", "თელავ": "Telavi",
                  "ზუგდიდ": "Zugdidi", "გორ": "Gori", "გუდაურ": "Gudauri",
                  "ბაკურიან": "Bakuriani", "ბორჯომ": "Borjomi",
              }
              def clean(seg):
                  toks = [w for w in seg.split()
                          if not any(ch.isdigit() for ch in w) and not w.startswith("#")]
                  name = " ".join(toks).strip()
                  if name in GE_CITY:
                      return GE_CITY[name]
                  for w in toks:
                      for root, en in GE_ROOT.items():
                          if w.startswith(root):
                              return en
                  return name
              def moveo_city(addr):
                  parts = [p.strip() for p in (addr or "").replace("|", ",").split(",") if p.strip()]
                  if not parts:
                      return ""
                  for p in parts:                       # segment carrying the postal code = city
                      if any(len(w) == 4 and w.isdigit() for w in p.split()):
                          return clean(p)
                  named = [p for p in parts if p not in ("საქართველო", "Georgia", "georgia")]
                  return clean(named[-1]) if named else ""
              return fetch_ampeco("cp.moveo.ge", "MOVEO", "moveo", city_fn=moveo_city)

          # ── Da-Tene (PlugsHub platform — NOT AMPECO) ───────────────────────
          # Multi-tenant API: every request needs an X-Tenant-ID header. We log
          # in fresh each run (POST /auth/login) and read stations from
          # /app/charging_stations_v5/. Credentials come from GitHub secrets.
          def fetch_datene():
              base   = "https://apps.plugshub.io"
              phone  = os.environ.get("PLUGSHUB_PHONE")
              pwd    = os.environ.get("PLUGSHUB_PASSWORD")
              tenant = os.environ.get("PLUGSHUB_TENANT_ID")
              if not (phone and pwd and tenant):
                  print("Da-Tene: PLUGSHUB_PHONE/PASSWORD/TENANT_ID not set — skipping")
                  return []
              base_headers = {"Content-Type": "application/json",
                              "Accept": "application/json", "X-Tenant-ID": tenant}

              # 1) Login -> Bearer token
              lr = requests.post(f"{base}/auth/login",
                                 json={"phone": phone, "password": pwd},
                                 headers=base_headers, timeout=30)
              lr.raise_for_status()
              lb = lr.json()
              token = lb.get("token") or (lb.get("data") or {}).get("token")
              if not token:
                  print("Da-Tene: no token in login response")
                  return []
              auth = {"Authorization": f"Bearer {token}",
                      "Accept": "application/json", "X-Tenant-ID": tenant}

              # 2) Stations (returns a plain list; paginate defensively)
              raw, url, guard = [], f"{base}/app/charging_stations_v5/", 0
              while url and guard < 50:
                  guard += 1
                  r = requests.get(url, headers=auth, timeout=60)
                  r.raise_for_status()
                  body = r.json()
                  if isinstance(body, list):
                      raw.extend(body); url = None
                  elif isinstance(body, dict):
                      raw.extend(body.get("data") or body.get("results") or body.get("stations") or [])
                      url = (body.get("links") or {}).get("next") or body.get("next")
                  else:
                      url = None

              # connector normalization -> app filter chips
              CONN_MAP = {
                  "ccs": "CCS2", "ccs2": "CCS2", "combo2": "CCS2", "iec62196t2combo": "CCS2",
                  "ccs1": "CCS1", "combo1": "CCS1",
                  "chademo": "CHAdeMO",
                  "type2": "Type 2", "mennekes": "Type 2", "iec62196t2": "Type 2",
                  "type1": "Type 1", "j1772": "Type 1",
                  "gbt": "GB/T", "gb_t": "GB/T", "gbtdc": "GB/T", "gbtac": "GB/T",
                  "nacs": "NACS", "tesla": "NACS",
              }
              def norm_conn(t):
                  if not t: return None
                  k = str(t).lower().replace(" ", "").replace("-", "").replace("_", "").replace("/", "")
                  return CONN_MAP.get(k)

              def fmt_amt(v):
                  try:
                      f = float(v)
                  except Exception:
                      return None
                  return f"{f:.2f}".rstrip("0").rstrip(".")

              stations = []
              for loc in raw:
                  coords = str(loc.get("geo_coordinates") or "")
                  if "," not in coords:
                      continue
                  try:
                      lat, lng = [float(x) for x in coords.split(",")[:2]]
                  except Exception:
                      continue

                  # avail / total count PORTS (connectors) across all chargers.
                  # port_details: one {type,status} per connector for the app's
                  # per-plug colours. No charging-since on this platform.
                  conns, max_power, avail, total, any_dc, price = set(), 0.0, 0, 0, False, ""
                  port_details = []
                  BUSY = ("charging", "occupied", "preparing", "finishing",
                          "inuse", "in_use", "busy", "suspended", "reserved")
                  for ch in (loc.get("chargers") or []):
                      try: max_power = max(max_power, float(ch.get("max_output") or 0))
                      except: pass
                      # A working charger reports status "available" (or
                      # "online"); only "offline" means the whole unit is down.
                      ch_offline = str(ch.get("status", "")).lower() == "offline"
                      cs = ch.get("connectors") or []
                      total += len(cs)
                      for c in cs:
                          ctype = str(c.get("type") or "")          # e.g. "CCS2 • DC"
                          ct = norm_conn(ctype.split("•")[0].strip())
                          if ct: conns.add(ct)
                          if "DC" in ctype.upper(): any_dc = True
                          st = str(c.get("status", "")).lower()
                          # Status is driven by the CONNECTOR's own status, not
                          # the charger's: a plug is free iff it reports
                          # "available", busy while charging/preparing, and out
                          # only when its charger is offline or the plug itself
                          # is faulted/unavailable. (The old code gated free on
                          # charger status == "online"; since working chargers
                          # actually report "available", that marked ~90% of
                          # live plugs "out of order".)
                          if ch_offline:
                              ps = "out"
                          elif st == "available":
                              ps = "free"
                          elif any(k in st for k in BUSY):
                              ps = "busy"
                          else:
                              ps = "out"
                          if ps == "free":
                              avail += 1
                          port_details.append(
                              {"type": ct or (ctype.split("•")[0].strip() or "?"), "status": ps})
                          if not price:
                              a = fmt_amt(c.get("price"))
                              if a:
                                  cur = c.get("currency") or "₾"
                                  price = f"{a} {cur}/kWh"

                  kw = round(max_power)
                  name = loc.get("label") or loc.get("address_line_1") or "Da-Tene"
                  city = loc.get("city") or loc.get("state") or ""
                  stations.append({
                      "id": f"datene_{loc.get('id')}",
                      "name": name,
                      "lat": lat,
                      "lng": lng,
                      "power": (f"{int(kw)} kW" if kw else "—"),
                      "type": "Fast DC" if any_dc else "AC",
                      "price": price,
                      "available_spots": f"{avail} available",
                      "total_spots": total,
                      "city": city,
                      "provider": "Da-Tene",
                      "connectors": sorted(conns),
                      "ports": port_details,
                      "last_updated": "Just now",
                  })
              print(f"Da-Tene: {len(stations)} stations")
              return stations

          # ── Gadatene (PlugsHub white-label — same platform as Da-Tene) ─────
          # Identical multi-tenant API and station schema as Da-Tene, but on its
          # own host/tenant/version: login at auth.gadatene.com, stations at
          # apps.gadatene.com/app/charging_stations_v3/. Credentials come from
          # GitHub secrets; tenant id is fixed for this white-label instance.
          def fetch_gadatene():
              auth_base = "https://auth.gadatene.com"
              api_base  = "https://apps.gadatene.com"
              tenant    = "4aeecc14-b023-4bf4-bec2-34b0eccba8e1"
              phone     = os.environ.get("GADATENE_PHONE")
              pwd       = os.environ.get("GADATENE_PASSWORD")
              if not (phone and pwd):
                  print("Gadatene: GADATENE_PHONE/PASSWORD not set — skipping")
                  return []
              base_headers = {"Content-Type": "application/json",
                              "Accept": "application/json", "X-Tenant-ID": tenant}

              # 1) Login -> Bearer token
              lr = requests.post(f"{auth_base}/auth/login",
                                 json={"phone": phone, "password": pwd},
                                 headers=base_headers, timeout=30)
              lr.raise_for_status()
              lb = lr.json()
              token = lb.get("token") or (lb.get("data") or {}).get("token")
              if not token:
                  print("Gadatene: no token in login response")
                  return []
              auth = {"Authorization": f"Bearer {token}",
                      "Accept": "application/json", "X-Tenant-ID": tenant}

              # 2) Stations (returns a plain list; paginate defensively)
              raw, url, guard = [], f"{api_base}/app/charging_stations_v3/", 0
              while url and guard < 50:
                  guard += 1
                  r = requests.get(url, headers=auth, timeout=60)
                  r.raise_for_status()
                  body = r.json()
                  if isinstance(body, list):
                      raw.extend(body); url = None
                  elif isinstance(body, dict):
                      raw.extend(body.get("data") or body.get("results") or body.get("stations") or [])
                      url = (body.get("links") or {}).get("next") or body.get("next")
                  else:
                      url = None

              # connector normalization -> app filter chips (same map as Da-Tene)
              CONN_MAP = {
                  "ccs": "CCS2", "ccs2": "CCS2", "combo2": "CCS2", "iec62196t2combo": "CCS2",
                  "ccs1": "CCS1", "combo1": "CCS1",
                  "chademo": "CHAdeMO",
                  "type2": "Type 2", "mennekes": "Type 2", "iec62196t2": "Type 2",
                  "type1": "Type 1", "j1772": "Type 1",
                  "gbt": "GB/T", "gb_t": "GB/T", "gbtdc": "GB/T", "gbtac": "GB/T",
                  "nacs": "NACS", "tesla": "NACS",
              }
              def norm_conn(t):
                  if not t: return None
                  k = str(t).lower().replace(" ", "").replace("-", "").replace("_", "").replace("/", "")
                  return CONN_MAP.get(k)

              def fmt_amt(v):
                  try:
                      f = float(v)
                  except Exception:
                      return None
                  return f"{f:.2f}".rstrip("0").rstrip(".")

              stations = []
              for loc in raw:
                  coords = str(loc.get("geo_coordinates") or "")
                  if "," not in coords:
                      continue
                  try:
                      lat, lng = [float(x) for x in coords.split(",")[:2]]
                  except Exception:
                      continue

                  # avail / total count PORTS (connectors) across all chargers.
                  # port_details: one {type,status} per connector for the app's
                  # per-plug colours. No charging-since on this platform.
                  conns, max_power, avail, total, any_dc, price = set(), 0.0, 0, 0, False, ""
                  port_details = []
                  BUSY = ("charging", "occupied", "preparing", "finishing",
                          "inuse", "in_use", "busy", "suspended", "reserved")
                  for ch in (loc.get("chargers") or []):
                      try: max_power = max(max_power, float(ch.get("max_output") or 0))
                      except: pass
                      # A working charger reports status "available" (or
                      # "online"); only "offline" means the whole unit is down.
                      ch_offline = str(ch.get("status", "")).lower() == "offline"
                      cs = ch.get("connectors") or []
                      total += len(cs)
                      for c in cs:
                          ctype = str(c.get("type") or "")          # e.g. "CCS2 • DC"
                          ct = norm_conn(ctype.split("•")[0].strip())
                          if ct: conns.add(ct)
                          if "DC" in ctype.upper(): any_dc = True
                          st = str(c.get("status", "")).lower()
                          # Status is driven by the CONNECTOR's own status, not
                          # the charger's: a plug is free iff it reports
                          # "available", busy while charging/preparing, and out
                          # only when its charger is offline or the plug itself
                          # is faulted/unavailable. (The old code gated free on
                          # charger status == "online"; since working chargers
                          # actually report "available", that marked ~90% of
                          # live plugs "out of order".)
                          if ch_offline:
                              ps = "out"
                          elif st == "available":
                              ps = "free"
                          elif any(k in st for k in BUSY):
                              ps = "busy"
                          else:
                              ps = "out"
                          if ps == "free":
                              avail += 1
                          port_details.append(
                              {"type": ct or (ctype.split("•")[0].strip() or "?"), "status": ps})
                          if not price:
                              a = fmt_amt(c.get("price"))
                              if a:
                                  cur = c.get("currency") or "₾"
                                  price = f"{a} {cur}/kWh"

                  kw = round(max_power)
                  name = loc.get("label") or loc.get("address_line_1") or "Gadatene"
                  city = loc.get("city") or loc.get("state") or ""
                  stations.append({
                      "id": f"gadatene_{loc.get('id')}",
                      "name": name,
                      "lat": lat,
                      "lng": lng,
                      "power": (f"{int(kw)} kW" if kw else "—"),
                      "type": "Fast DC" if any_dc else "AC",
                      "price": price,
                      "available_spots": f"{avail} available",
                      "total_spots": total,
                      "city": city,
                      "provider": "Gadatene",
                      "connectors": sorted(conns),
                      "ports": port_details,
                      "last_updated": "Just now",
                  })
              print(f"Gadatene: {len(stations)} stations")
              return stations

          # ── EcoCars (ChargerSystem platform — AWS Cognito SRP auth) ─────────
          # Global station list at /stations/cache (Bearer only). EcoCars is the
          # vendorId b534372b...; we filter to that vendor and to GE/AM/TR coords.
          #
          # Connector `type` is a platform-wide int enum (ChargerSystem, shared by
          # every vendor). There is no public dictionary endpoint, so the map below
          # was reverse-engineered from ground truth (not power-class guessing):
          #   • Samtredia/BOG1, verified plug-for-plug against the EcoCars app:
          #       1 = CHAdeMO (41kW), 2 = CCS1 "CCS Type 1" (61kW), 8 = Type 2
          #   • MIONI/GE503:                       4 = CCS2, 5 = Type 1, 26 = GB/T
          #   • Single-connector stations across the whole 4k-station platform whose
          #     NAME states the plug: 3 = CCS2, 25 = GB/T(AC), 27/28 = NACS
          #     ("624 NACS - конектор для тесла"), 5 = Type 1 (J1772).
          #   • EcoCars GE fast-DC sites pair the primary gun (3/4/30) with GB/T(26)
          #     + AC; 240kW sites carry NACS(27) *alongside* CCS2(4), so 27 is a
          #     distinct plug, not another CCS2. 27 is the "missing NACS" chargers.
          # Unknown ints -> None (counted as a port, just unlabelled). Several ints
          # map to one chip because different charger firmware report the same
          # physical plug under different codes. DC_TYPES drives the Fast-DC/AC
          # split; a >=43kW port is a backup DC signal.
          #
          # Connector `status` is the OCPP-1.6 status enum as ints, validated on the
          # Samtredia station against the EcoCars app (status 1 renders "Available",
          # status 10 renders "Unknown"): 1 = Available (free); 2..7 = Preparing/
          # Charging/SuspendedEVSE/SuspendedEV/Finishing/Reserved (busy); 8 =
          # Unavailable, 9 = Faulted, 10 = Offline, 11 = EMO, anything else -> out.
          # (The cache's station-level `online` flag is always false here, so the
          # per-connector status is the live signal — matching the app.)
          def fetch_ecocars():
              user = os.environ.get("ECOCARS_USERNAME")
              pwd  = os.environ.get("ECOCARS_PASSWORD")
              if not (user and pwd):
                  print("EcoCars: ECOCARS_USERNAME/PASSWORD not set — skipping")
                  return []
              from pycognito import Cognito
              VENDOR = "b534372b-41c5-41b4-b54c-ba5e92851a79"
              cog = Cognito(
                  user_pool_id="eu-central-1_jipiA27RZ",
                  client_id="6621gvg74rlpc54t09nsfc6ja3",
                  user_pool_region="eu-central-1",
                  username=user)
              cog.authenticate(password=pwd)   # SRP under the hood
              hdr = {"Authorization": f"Bearer {cog.id_token}", "Accept": "application/json"}
              cache = requests.get("https://api.chargersystem.com/api/v1/stations/cache",
                                   headers=hdr, timeout=90).json()

              # GE/AM/TR coordinate boxes (STEP C: drop everything else).
              BOXES = [("Georgia",41.0,43.6,40.0,46.7),
                       ("Armenia",38.8,41.3,43.4,46.6),
                       ("Turkey", 35.8,42.1,26.0,44.8)]
              def in_region(lat, lng):
                  return any(a<=lat<=b and c<=lng<=d for _,a,b,c,d in BOXES)

              # Connector int -> chip (see header for the ground-truth derivation).
              CONN_INT = {
                  1:"CHAdeMO", 2:"CCS1", 3:"CCS2", 4:"CCS2", 30:"CCS2",
                  5:"Type 1", 6:"Type 1", 8:"Type 2", 9:"Type 2",
                  25:"GB/T", 26:"GB/T", 27:"NACS", 28:"NACS",
              }
              DC_TYPES = {1, 2, 3, 4, 26, 27, 28, 30}   # -> Fast DC classification
              def conn_name(t):
                  return CONN_INT.get(t)
              ORDER = ["CCS2","GB/T","CHAdeMO","Type 2","NACS","CCS1","Type 1"]
              def sort_conns(cs):
                  return sorted(cs, key=lambda c:(ORDER.index(c) if c in ORDER else len(ORDER), c))

              # OCPP status int -> our canonical port state.
              BUSY_ST = {2, 3, 4, 5, 6, 7}
              def port_state(st):
                  if st == 1:        return "free"
                  if st in BUSY_ST:  return "busy"
                  return "out"       # 8/9/10/11 (Unavailable/Faulted/Offline/EMO) + unknown

              SIGN = {"GEL":"₾","AMD":"֏","USD":"$","EUR":"€","TRY":"₺","UAH":"₴"}
              def derive_city(addr):
                  parts = [p.strip() for p in (addr or "").split(",") if p.strip()]
                  cand = parts[-2] if len(parts)>=3 else (parts[0] if parts else "")
                  toks = [t for t in cand.split() if not any(ch.isdigit() for ch in t)]
                  return " ".join(toks).replace("T'bilisi","Tbilisi").strip()
              def derive_name(s):
                  nm = (s.get("name") or "").strip()
                  if nm and nm.lower() not in ("name", "test", "old test", "tbd"):
                      return nm
                  # EcoCars occasionally ships a placeholder name — fall back to the
                  # street (first address segment) so the app isn't titled "name".
                  parts = [p.strip() for p in (s.get("address") or "").split(",") if p.strip()]
                  return (parts[0] if parts else "") or "EcoCars"

              # The bulk /stations/cache is a laggy snapshot: its per-connector
              # status and the station `online` flag trail real time (measured:
              # ~5% of connectors and ~2/3 of online flags disagree with the live
              # view). So use the cache only to ENUMERATE our stations, then pull
              # each one's LIVE status from /stations/{id} — the same per-station
              # endpoint the EcoCars app itself uses. Detail rows share the cache
              # schema (geo/connectors/conn[]), so on any failure we fall back to
              # the cache row transparently. Threaded: ~150 calls in <10s.
              targets = [s for s in cache
                         if s.get("vendorId") == VENDOR
                         and (s.get("geo") or {}).get("lat") is not None
                         and in_region(s["geo"]["lat"], s["geo"]["lon"])]
              import concurrent.futures as _cf
              sess = requests.Session(); sess.headers.update(hdr)
              def _detail(s):
                  try:
                      r = sess.get(f"https://api.chargersystem.com/api/v1/stations/{s['id']}", timeout=30)
                      if r.status_code == 200:
                          d = r.json()
                          if isinstance(d, dict) and d.get("id") is not None:
                              return d
                  except Exception as e:
                      print("EcoCars: detail", s.get("id"), "error:", e)
                  return s   # fall back to the (stale) cache row on any failure
              with _cf.ThreadPoolExecutor(max_workers=8) as _ex:
                  detailed = list(_ex.map(_detail, targets))

              stations = []
              for s in detailed:
                  g = s.get("geo") or {}
                  lat = g.get("lat"); lng = g.get("lon")
                  if lat is None or lng is None:
                      continue
                  # lastStatusUpdateDate lives in the parallel `conn` array (keyed
                  # by connector id) — use it as the charging-since for busy ports.
                  since_by_id = {}
                  for c in (s.get("conn") or []):
                      d = c.get("lastStatusUpdateDate")
                      if c.get("id") is not None and d:
                          since_by_id[c.get("id")] = d

                  # avail / total count PORTS (connectors) at the station; each port
                  # carries its own free/busy/out state, per-plug price and (for busy
                  # plugs) the charging-since so the app can colour and time them.
                  conns, maxkw, avail, total, any_dc, price = set(), 0.0, 0, 0, False, ""
                  port_details = []
                  for c in (s.get("connectors") or []):
                      total += 1
                      t = c.get("type")
                      nm = conn_name(t)
                      if nm: conns.add(nm)
                      kw = c.get("maxOutputKw") or 0
                      try: kwf = float(kw)
                      except: kwf = 0.0
                      maxkw = max(maxkw, kwf)
                      if t in DC_TYPES or kwf >= 43:
                          any_dc = True
                      ps = port_state(c.get("status"))
                      if ps == "free":
                          avail += 1
                      port = {"type": nm or "?", "status": ps}
                      if ps == "busy" and since_by_id.get(c.get("id")):
                          port["since"] = since_by_id[c.get("id")]
                      # Per-connector price (EcoCars prices each plug; 0 => free).
                      en = (c.get("rates") or {}).get("energy") or {}
                      try: pnum = float(en.get("price"))
                      except: pnum = 0.0
                      if pnum > 0:
                          cur = en.get("currencyCode", "GEL")
                          a = f"{pnum:.2f}".rstrip("0").rstrip(".")
                          pstr = f"{a} {SIGN.get(cur, cur)}/kWh"
                          port["price"] = pstr
                          if not price:
                              price = pstr
                      port_details.append(port)
                  kw = round(maxkw)
                  stations.append({
                      "id": f"ecocars_{s.get('id')}",
                      "name": derive_name(s),
                      "lat": lat,
                      "lng": lng,
                      "power": (f"{int(kw)} kW" if kw else "—"),
                      "type": "Fast DC" if any_dc else "AC",
                      "price": price,
                      "available_spots": f"{avail} available",
                      "total_spots": total,
                      "city": derive_city(s.get("address")),
                      "provider": "EcoCars",
                      "connectors": sort_conns(conns),
                      "ports": port_details,
                      "last_updated": "Just now",
                  })
              print(f"EcoCars: {len(stations)} stations")
              return stations

          # ── Solar Station (custom OCPP backend — public, no auth needed) ───
          # Solar Station runs its own NestJS backend. GET /chargers returns the
          # full charger list (public, no token required). Each record is one
          # physical charger (not a multi-charger location), so we map 1:1.
          # `connectors[].type` is already a chip label ("GB/T"/"CCS2"/"Type 2").
          # DC vs AC: CCS2 is always DC; GB/T ships in slow-AC (≤11 kW) and fast-DC
          # variants, so we key off power — ≥20 kW ⇒ DC, which cleanly separates
          # the 7/11 kW AC units from the 40–160 kW DC ones.
          def fetch_solarstation():
              base = "https://charger.solarauto.ge"
              r = requests.get(f"{base}/chargers", timeout=60)
              r.raise_for_status()
              raw = r.json()

              CONN_MAP = {
                  "ccs": "CCS2", "ccs2": "CCS2", "combo2": "CCS2",
                  "ccs1": "CCS1", "combo1": "CCS1",
                  "chademo": "CHAdeMO",
                  "type2": "Type 2", "mennekes": "Type 2",
                  "type1": "Type 1", "j1772": "Type 1",
                  "gbt": "GB/T", "gb_t": "GB/T", "gbtdc": "GB/T", "gbtac": "GB/T",
                  "nacs": "NACS", "tesla": "NACS",
              }
              def norm_conn(t):
                  if not t: return None
                  k = str(t).lower().replace(" ", "").replace("-", "").replace("_", "").replace("/", "")
                  return CONN_MAP.get(k)
              ORDER = ["CCS2","GB/T","CHAdeMO","Type 2","NACS","CCS1","Type 1"]
              def sort_conns(cs):
                  return sorted(cs, key=lambda c:(ORDER.index(c) if c in ORDER else len(ORDER), c))

              stations = []
              for c in raw:
                  if c.get("is_hidden"):
                      continue
                  lat = c.get("latitude"); lng = c.get("longitude")
                  if lat is None or lng is None:
                      continue
                  try:
                      power = float(c.get("outputPower") or 0)
                  except Exception:
                      power = 0.0
                  # A charger is "online" only when both top-level flags are set;
                  # each operative connector on an online charger counts as free.
                  # port_details: per-plug free/out — this backend exposes no
                  # charging state, so there's no busy / charging-since.
                  online = bool(c.get("charger_status")) and bool(c.get("status"))
                  conns = set()
                  port_details = []
                  for cc in (c.get("connectors") or []):
                      nm = norm_conn(cc.get("type"))
                      if nm: conns.add(nm)
                      free = online and bool(cc.get("isOperative"))
                      port_details.append({"type": nm or (str(cc.get("type")) or "?"),
                                           "status": "free" if free else "out"})
                  any_dc = power >= 20 or "CCS2" in conns
                  total  = len(c.get("connectors") or [])
                  avail  = sum(1 for cc in (c.get("connectors") or [])
                               if cc.get("isOperative")) if online else 0
                  try:
                      pk = float(c.get("kilowattPrice") or 0)
                  except Exception:
                      pk = 0.0
                  price = f"{pk:.2f} ₾/kWh" if pk > 0 else ""
                  addr = (c.get("address") or "Solar Station").strip()
                  kw = round(power)
                  stations.append({
                      "id": f"solar_{c.get('id')}",
                      "name": addr,
                      "lat": lat,
                      "lng": lng,
                      "power": (f"{int(kw)} kW" if kw else "—"),
                      "type": "Fast DC" if any_dc else "AC",
                      "price": price,
                      "available_spots": f"{avail} available",
                      "total_spots": total,
                      "city": addr,
                      "provider": "Solar Station",
                      "connectors": sort_conns(conns),
                      "ports": port_details,
                      "last_updated": "Just now",
                  })
              print(f"Solar Station: {len(stations)} stations")
              return stations

          # ── Tegeta Motors (REST catalog + public Firestore live status) ────
          # Two public, no-auth sources joined together:
          #  1) REST catalog mobileapi.tegetamotors.ge/api/v1/EVs/ChargeStations —
          #     locations, charge points, connector types, prices. It is behind
          #     Cloudflare (403s a bare python-requests UA) and carries NO live
          #     status and NO kW rating, so power is reported as "—".
          #  2) Cloud Firestore (project tegeta-app-prod, collection `chargePoints`,
          #     world-readable) — live per-connector status, joined to the catalog
          #     by chargeStationId == station id, overlaid in catalog order.
          def fetch_tegeta():
              UA = {"User-Agent": "okhttp/4.12.0"}
              # Cloudflare passes the real app's header signature (okhttp UA +
              # JSON accept + ka locale + keep-alive); sparser requests get an
              # intermittent 403, and a CI IP occasionally trips it, so retry.
              H = {"Accept": "application/json", "Accept-Language": "ka",
                   "Connection": "keep-alive", **UA}

              def _get(u, headers, tries=5):
                  last = None
                  for _ in range(tries):
                      try:
                          resp = requests.get(u, headers=headers, timeout=60)
                          if resp.status_code == 200:
                              return resp
                          last = requests.exceptions.HTTPError(f"{resp.status_code} for {u}")
                      except Exception as e:
                          last = e
                      time.sleep(2)
                  raise last

              # 1) Static catalog (envelope: {data, errorCode, errorMessage, statusCode})
              r = _get("https://mobileapi.tegetamotors.ge/api/v1/EVs/ChargeStations", H)
              catalog = (r.json() or {}).get("data") or []

              # 2) Live status from public Firestore REST.
              fs = "https://firestore.googleapis.com/v1/projects/tegeta-app-prod/databases/(default)/documents"
              docs, url, guard = [], f"{fs}/chargePoints?pageSize=300", 0
              while url and guard < 20:
                  guard += 1
                  fj = _get(url, UA).json()
                  docs += fj.get("documents", [])
                  tok = fj.get("nextPageToken")
                  url = f"{fs}/chargePoints?pageSize=300&pageToken={tok}" if tok else None

              def gv(f):  # unwrap a Firestore typed value
                  if "stringValue"  in f: return f["stringValue"]
                  if "integerValue" in f: return int(f["integerValue"])
                  if "doubleValue"  in f: return f["doubleValue"]
                  return None

              # station id -> ordered live connector statuses (lowercased),
              # concatenated across that station's charge-point documents.
              live = {}
              for d in docs:
                  fl  = d.get("fields", {})
                  sid = gv(fl["chargeStationId"]) if "chargeStationId" in fl else None
                  if sid is None:
                      continue
                  for c in fl.get("connectors", {}).get("arrayValue", {}).get("values", []):
                      st = gv(c.get("mapValue", {}).get("fields", {}).get("status", {})) or ""
                      live.setdefault(sid, []).append(str(st).lower())

              def en(trs):  # pick the English translation (fall back to first)
                  for t in trs or []:
                      if t.get("language") == "EN":
                          return t.get("translation")
                  return (trs[0].get("translation") if trs else "") or ""

              CONN_MAP = {
                  "ccs": "CCS2", "ccs2": "CCS2", "combo2": "CCS2",
                  "ccs1": "CCS1", "combo1": "CCS1",
                  "chademo": "CHAdeMO",
                  "type2": "Type 2", "mennekes": "Type 2", "iec62196t2": "Type 2",
                  "type1": "Type 1", "j1772": "Type 1",
                  "gbt": "GB/T", "gb_t": "GB/T",
                  "nacs": "NACS", "tesla": "NACS",
              }
              def norm_conn(t):
                  if not t: return None
                  k = str(t).lower().replace(" ", "").replace("-", "").replace("_", "").replace("/", "")
                  return CONN_MAP.get(k)
              ORDER = ["CCS2", "GB/T", "CHAdeMO", "Type 2", "NACS", "CCS1", "Type 1"]
              def sort_conns(cs):
                  return sorted(cs, key=lambda c: (ORDER.index(c) if c in ORDER else len(ORDER), c))
              def fmt_amt(x):
                  return f"{x:.2f}"   # 2 decimals, matching Tegeta's own app (0.60 / 1.00)

              stations = []
              for s in catalog:
                  if s.get("isDeactivated"):
                      continue
                  lat, lng = s.get("latitude"), s.get("longitude")
                  if lat is None or lng is None:
                      continue
                  sid = s.get("id")

                  # Flatten every live (non-deactivated) connector in catalog
                  # order, capturing its chip type. Power isn't published, so DC
                  # is inferred from the "Fast" charge-point type or a DC plug.
                  conns, any_dc = set(), False
                  rest_conns = []  # (chip_type, price_str, price_num) per connector, catalog order
                  for cp in s.get("chargePoints", []):
                      if cp.get("isDeactivated"):
                          continue
                      is_fast = (cp.get("type") or {}).get("id") == 1  # 1=Fast(DC) 2=Standard(AC)
                      for c in cp.get("connectors", []):
                          ct = norm_conn(en((c.get("connectorType") or {}).get("typeTranslations")))
                          if ct: conns.add(ct)
                          if is_fast or ct in ("CCS2", "CHAdeMO", "CCS1", "GB/T"):
                              any_dc = True
                          pv = c.get("price")
                          pnum = float(pv) if pv is not None else None
                          pstr = f"{fmt_amt(pnum)} ₾/kWh" if pnum is not None else ""
                          rest_conns.append((ct, pstr, pnum))

                  # Overlay live status onto catalog connectors (zip by order) and
                  # attach each connector's own price — Tegeta prices DC fast and
                  # AC sockets differently. A plug the catalog lists but Firestore
                  # omits reads as "out". Status vocab: Available/Unavailable/Undefined.
                  statuses = live.get(sid, [])
                  port_details, price_nums = [], []
                  for i, (ct, pstr, pnum) in enumerate(rest_conns):
                      st = statuses[i] if i < len(statuses) else None
                      if   st == "available":   ps = "free"
                      elif st == "unavailable": ps = "busy"
                      else:                     ps = "out"
                      port = {"type": ct or "?", "status": ps}
                      if pstr:
                          port["price"] = pstr
                      port_details.append(port)
                      if pnum is not None:
                          price_nums.append(pnum)
                  total = len(rest_conns)
                  avail = sum(1 for p in port_details if p["status"] == "free")

                  # Station price: one value, or a lo–hi range when connectors differ.
                  if price_nums:
                      lo, hi = min(price_nums), max(price_nums)
                      price = (f"{fmt_amt(lo)} ₾/kWh" if lo == hi
                               else f"{fmt_amt(lo)}–{fmt_amt(hi)} ₾/kWh")
                  else:
                      price = ""

                  name = en(s.get("nameTranslations")) or en(s.get("addressTranslations")) or "Tegeta"
                  city = en((s.get("city") or {}).get("nameTranslations")) or name.split(",")[0]
                  stations.append({
                      "id": f"tegeta_{sid}",
                      "name": name,
                      "lat": lat,
                      "lng": lng,
                      "power": "—",              # Tegeta doesn't publish kW
                      "type": "Fast DC" if any_dc else "AC",
                      "price": price,
                      "available_spots": f"{avail} available",
                      "total_spots": total,
                      "city": city,
                      "provider": "Tegeta",
                      "connectors": sort_conns(conns),
                      "ports": port_details,
                      "last_updated": "Just now",
                  })
              print(f"Tegeta: {len(stations)} stations")
              return stations

          # ── Charger Plus (public live status over WebSocket) ───────────────
          #  Charger Plus (com.chargerplus.app, 3.0.6) serves its live map over a
          #  public WebSocket: connect to wss://ws.chargerpl.us/ (no auth) and the
          #  server pushes one {"action":"connection","data":[stations]} frame with
          #  every station's location, power and *live* per-connector status, then
          #  closes. See docs/chargerplus_api.md. Connector *types* are not in the
          #  public feed, but Charger Plus runs a homogeneous fleet — validated
          #  against live station cores (e.g. #9711, #9738): DC sites carry
          #  GB/T(DC) + CCS/2, AC sites carry Type 2 — so we derive them by power.
          def fetch_chargerplus():
              import socket, ssl, struct, base64 as _b64

              def ws_snapshot(timeout=20):
                  host = "ws.chargerpl.us"
                  sock = ssl.create_default_context().wrap_socket(
                      socket.create_connection((host, 443), timeout=timeout),
                      server_hostname=host)
                  key = _b64.b64encode(os.urandom(16)).decode()
                  sock.send((f"GET / HTTP/1.1\r\nHost: {host}\r\nUpgrade: websocket\r\n"
                             f"Connection: Upgrade\r\nSec-WebSocket-Key: {key}\r\n"
                             f"Sec-WebSocket-Version: 13\r\nOrigin: https://cplus.ge\r\n\r\n").encode())
                  buf = b""
                  while b"\r\n\r\n" not in buf:
                      buf += sock.recv(4096)
                  if b"101" not in buf.split(b"\r\n", 1)[0]:
                      raise RuntimeError("ws upgrade failed")
                  data = buf.split(b"\r\n\r\n", 1)[1]
                  def readn(n, d):
                      while len(d) < n:
                          d += sock.recv(65536)
                      return d
                  payload = b""
                  data = readn(2, data)
                  while True:
                      b0, b1 = data[0], data[1]
                      ln = b1 & 0x7f; idx = 2
                      if ln == 126:
                          data = readn(4, data); ln = struct.unpack(">H", data[2:4])[0]; idx = 4
                      elif ln == 127:
                          data = readn(10, data); ln = struct.unpack(">Q", data[2:10])[0]; idx = 10
                      data = readn(idx + ln, data)
                      payload += data[idx:idx + ln]
                      if (b0 & 0x0f) in (1, 2) and (b0 & 0x80):
                          break
                      data = readn(2, data[idx + ln:])
                  sock.close()
                  return json.loads(payload.decode("utf-8", "replace").split("\x1e")[0])

              # station_id -> site name, from the authed getStationPools call
              # (highway/multi-charger sites; captured once, they rarely change).
              POOL_NAMES = {
                  144: "Kakheti Hwy 147", 146: "Kakheti Hwy 147",
                  115: "Rikoti", 151: "Rikoti", 152: "Rikoti",
                  121: "Zugdidi", 148: "Zugdidi",
                  114: "Autobahn, Gori", 153: "Autobahn, Gori", 154: "Autobahn, Gori",
                  123: "Green Way, Kobuleti", 158: "Green Way, Kobuleti",
                  116: "Argveta, Zestaponi", 156: "Argveta, Zestaponi", 157: "Argveta, Zestaponi",
                  120: "Samtredia", 147: "Samtredia",
              }
              # snapshot connector status -> our app's canonical port status.
              # The app (ConnectorPort) only understands 'free' | 'busy' | 'out';
              # anything else renders as "out of order", so map explicitly.
              FREE = {"Available", "NoError"}
              BUSY = {"Charging", "Preparing", "Finishing", "Reserved",
                      "SuspendedEV", "SuspendedEVSE", "Occupied"}
              def port_status(station_online, conn_status):
                  if not station_online:
                      return "out"          # whole charge-point offline
                  if conn_status in FREE:
                      return "free"
                  if conn_status in BUSY:
                      return "busy"
                  return "out"              # Faulted / Unavailable / unknown

              obj = ws_snapshot()
              rows = obj.get("data", []) if isinstance(obj, dict) else []
              stations = []
              for x in rows:
                  try:
                      lat = float(x["latitude"]); lng = float(x["longitude"])
                  except Exception:
                      continue
                  # Georgia only (drop the lone test point in Saudi Arabia)
                  if not (41.0 <= lat <= 43.6 and 40.0 <= lng <= 46.9):
                      continue
                  sid = x["id"]
                  conns = x.get("connectors", []) or []
                  watts = x.get("power") or 0
                  is_dc = watts >= 50000
                  n = len(conns)
                  # derive connector types (homogeneous fleet, validated on live cores)
                  if is_dc:
                      type_seq = (["GB/T", "CCS2"] if n >= 2 else ["CCS2"])
                  else:
                      type_seq = ["Type 2"] * max(n, 1)
                  online = (x.get("status") != "Offline")
                  ports = []
                  avail = 0
                  for i, c in enumerate(conns):
                      ps = port_status(online, c.get("status"))
                      if ps == "free":
                          avail += 1
                      ports.append({
                          "type": type_seq[i] if i < len(type_seq) else type_seq[-1],
                          "power": f"{round(watts/1000)} kW" if watts else "—",
                          "status": ps,
                      })
                  name = POOL_NAMES.get(sid) or f"Charger Plus #{x.get('name') or sid}"
                  stations.append({
                      "id": f"chargerplus_{sid}",
                      "name": name,
                      "lat": lat,
                      "lng": lng,
                      "power": f"{round(watts/1000)} kW" if watts else "—",
                      "type": "Fast DC" if is_dc else "AC",
                      "price": "",
                      "available_spots": f"{avail} available",
                      "total_spots": n,
                      "city": POOL_NAMES.get(sid, "").split(",")[-1].strip(),
                      "provider": "Charger Plus",
                      "connectors": sorted(set(type_seq)),
                      "ports": ports,
                      "last_updated": "Just now",
                  })
              print(f"Charger Plus: {len(stations)} stations")
              return stations

          # ── E-Space (own backend — public map API, no user login) ──────────
          # E-Space (ge.e_space.app v8.0.7) serves its live map at
          # prod.e-space.ge/api/v1/mobile/chargers. It needs a "public-key"
          # header (an application key embedded in the app; NOT per-user) — with
          # it the whole charger list, incl. live per-connector status, is public
          # (no OAuth). Each row is one physical charger with 1–3 connectors.
          # Live status is the `condition` field (station- and connector-level):
          # Active→free, Charging→busy, Inactive→out. Connector `type` is already
          # a chip label; `speed` is the kW rating. The feed carries NO session
          # start time, so "since" (how long busy) is synthesized by carrying it
          # forward from the previous gist snapshot.
          def fetch_espace():
              base = "https://prod.e-space.ge/api/v1"
              # Public application key embedded in the E-Space app; unlocks the
              # read-only public map API. Without it the API 401s "Missing or
              # invalid public application key".
              KEY = "d66b4c6c-2868-416a-8ab7-99ae63675c0a"
              H = {"public-key": KEY, "Accept": "application/json"}

              r = requests.get(f"{base}/mobile/chargers", headers=H, timeout=60)
              r.raise_for_status()
              raw = r.json()
              if not isinstance(raw, list):
                  raw = raw.get("data") or []

              # E-Space exposes no session-start time, so we synthesize "since" by
              # carrying forward when a plug FIRST read busy (keyed by station id +
              # plug index) from the gist's previous snapshot; a newly-busy plug is
              # stamped now. Best effort — if the previous gist can't be read we
              # just stamp everything now.
              prev_since = {}
              try:
                  g = requests.get(f"https://api.github.com/gists/{GIST_ID}",
                                   headers=headers, timeout=30).json()
                  fmeta = (g.get("files") or {}).get("chargers.json") or {}
                  content = fmeta.get("content")
                  if fmeta.get("truncated") and fmeta.get("raw_url"):
                      content = requests.get(fmeta["raw_url"], timeout=30).text
                  for st0 in json.loads(content or "[]"):
                      if st0.get("provider") != "E-Space":
                          continue
                      for i, p in enumerate(st0.get("ports") or []):
                          if p.get("since"):
                              prev_since[f"{st0.get('id')}#{i}"] = p["since"]
              except Exception as e:
                  print("E-Space: prev-since lookup failed:", e)

              CONN_MAP = {
                  "ccs": "CCS2", "ccs2": "CCS2", "combo2": "CCS2", "iec62196t2combo": "CCS2",
                  "ccs1": "CCS1", "combo1": "CCS1",
                  "chademo": "CHAdeMO",
                  "type2": "Type 2", "mennekes": "Type 2", "iec62196t2": "Type 2",
                  "type1": "Type 1", "j1772": "Type 1",
                  "gbt": "GB/T", "gb_t": "GB/T", "gbtdc": "GB/T", "gbtac": "GB/T",
                  "nacs": "NACS", "tesla": "NACS",
              }
              def norm_conn(t):
                  if not t: return None
                  k = str(t).lower().replace(" ", "").replace("-", "").replace("_", "").replace("/", "")
                  return CONN_MAP.get(k)
              ORDER = ["CCS2", "GB/T", "CHAdeMO", "Type 2", "NACS", "CCS1", "Type 1"]
              def sort_conns(cs):
                  return sorted(cs, key=lambda c: (ORDER.index(c) if c in ORDER else len(ORDER), c))
              def eng(v):
                  return (v or {}).get("en") or (v or {}).get("ka") or ""

              GE_CITIES = ["Tbilisi", "Batumi", "Kutaisi", "Rustavi", "Gori", "Telavi",
                           "Zugdidi", "Poti", "Ozurgeti", "Akhaltsikhe", "Mtskheta",
                           "Borjomi", "Bakuriani", "Gudauri", "Marneuli", "Khashuri",
                           "Zestaponi", "Senaki", "Kobuleti", "Samtredia", "Kaspi",
                           "Kareli", "Argveta", "Samgori"]
              def derive_city(addr, fallback):
                  low = (addr or "").lower()
                  for c in GE_CITIES:
                      if c.lower() in low:
                          return c
                  parts = [p.strip() for p in (addr or "").split(",") if p.strip()]
                  if len(parts) >= 2:
                      cand = parts[-2] if parts[-1].lower() in ("georgia", "საქართველო") else parts[0]
                      toks = [t for t in cand.split() if not any(ch.isdigit() for ch in t)]
                      if toks:
                          return " ".join(toks)
                  return fallback

              now_iso = datetime.now(timezone.utc).replace(microsecond=0).isoformat()

              stations = []
              for s in raw:
                  try:
                      lat = float(s.get("latitude")); lng = float(s.get("longitude"))
                  except Exception:
                      continue
                  if lat == 0 or lng == 0:
                      continue  # a few rows carry placeholder 0/0 coords

                  full_id = f"espace_{s.get('id')}"
                  st = str(s.get("condition") or "").strip().lower()    # active|charging|inactive
                  offline = (st == "inactive") or (str(s.get("is_available")).strip().lower() == "false")

                  conns, max_kw, any_dc = set(), 0.0, (str(s.get("type") or "").upper() == "FAST")
                  port_details = []
                  for c in (s.get("connector_types") or []):
                      ct = norm_conn(c.get("type"))
                      if ct: conns.add(ct)
                      if ct in ("CCS2", "CHAdeMO", "CCS1", "GB/T"):
                          any_dc = True
                      try: max_kw = max(max_kw, float(c.get("speed") or 0))
                      except: pass
                      cc = str(c.get("condition") or "").strip().lower()
                      if offline or cc == "inactive":
                          ps = "out"
                      elif cc == "charging":
                          ps = "busy"
                      elif cc == "active":
                          ps = "free"
                      else:
                          ps = "out"
                      port_details.append({"type": ct or (c.get("type") or "?"), "status": ps})

                  # Station flag can read "Charging" while every plug still says
                  # "Active" (feed lag); E-Space multi-gun units share one power
                  # module, so a live session occupies the whole charger. Flip the
                  # first free plug to busy so availability never reads free while
                  # a car is plugged in.
                  if not offline and st == "charging" and not any(p["status"] == "busy" for p in port_details):
                      for p in port_details:
                          if p["status"] == "free":
                              p["status"] = "busy"; break

                  for i, p in enumerate(port_details):
                      if p["status"] == "busy":
                          p["since"] = prev_since.get(f"{full_id}#{i}") or now_iso

                  total = len(port_details)
                  av    = sum(1 for p in port_details if p["status"] == "free")
                  kw    = round(max_kw)

                  try: pnum = float(s.get("price"))
                  except: pnum = None
                  if pnum and pnum > 0:
                      unit = "/min" if str(s.get("price_type") or "").lower() == "minute" else "/kWh"
                      price = f"{pnum:.2f} ₾{unit}"
                  else:
                      price = ""

                  name = eng(s.get("address")) or eng(s.get("title")) or "E-Space"
                  stations.append({
                      "id": full_id,
                      "name": name,
                      "lat": lat,
                      "lng": lng,
                      "power": (f"{int(kw)} kW" if kw else "—"),
                      "type": "Fast DC" if any_dc else "AC",
                      "price": price,
                      "available_spots": f"{av} available",
                      "total_spots": total,
                      "city": derive_city(eng(s.get("address")), name.split(",")[0]),
                      "provider": "E-Space",
                      "connectors": sort_conns(conns),
                      "ports": port_details,
                      "last_updated": "Just now",
                  })
              print(f"E-Space: {len(stations)} stations")
              return stations

          # ── Push "charger freed up" alerts ─────────────────────────────────
          # Diffs the previous gist availability against the freshly built one:
          # any station that went fully-busy → has-a-free-plug triggers an FCM
          # push to every device that armed an alert for it, then the one-shot
          # subscription is cleared. Only providers we actually re-fetched THIS
          # cycle are eligible, so a provider that fell back to its bundled
          # snapshot can never fire a false "it's free!" alert. Entirely
          # best-effort — any failure here never affects the gist update.
          def _avail(s):
              try:
                  return int(str(s.get("available_spots", "0")).split()[0])
              except Exception:
                  return 0

          def notify_freed(old_stations, new_stations, fresh_providers):
              sa_json = os.environ.get("FIREBASE_SERVICE_ACCOUNT", "").strip()
              if not sa_json:
                  return  # push alerts not configured — skip silently
              # Set of connector types with at least one FREE port right now.
              def free_types(s):
                  return {p.get("type") for p in (s.get("ports") or [])
                          if p.get("status") == "free" and p.get("type")}

              old_avail = {s.get("id"): _avail(s)
                           for s in old_stations if s.get("id")}
              old_free  = {s.get("id"): free_types(s)
                           for s in old_stations if s.get("id")}

              # New-state lookup, limited to providers we actually re-fetched
              # this cycle AND stations seen last cycle — so a first-seen or a
              # skipped-provider snapshot can never fire a false "it's free!".
              new_by_id = {}
              for s in new_stations:
                  sid = s.get("id")
                  if not sid or s.get("provider") not in fresh_providers:
                      continue
                  if sid not in old_avail:
                      continue
                  new_by_id[sid] = s
              if not new_by_id:
                  return

              # An alert fires when its target went busy -> free since last cycle.
              # conn set → that connector TYPE had no free port before and has one
              # now (matches any plug of the type). conn empty → legacy station-
              # level alert: fully occupied -> at least one free plug.
              def has_freed(sid, conn):
                  s = new_by_id.get(sid)
                  if s is None:
                      return False
                  if conn:
                      return conn not in old_free.get(sid, set()) \
                          and conn in free_types(s)
                  return old_avail.get(sid, 0) == 0 and _avail(s) > 0

              import firebase_admin
              from firebase_admin import credentials, messaging, firestore
              if not firebase_admin._apps:
                  firebase_admin.initialize_app(
                      credentials.Certificate(json.loads(sa_json)))
              db = firestore.client()

              sent = 0
              for doc in db.collection("charger_alerts").stream():
                  data  = doc.to_dict() or {}
                  token = data.get("token")
                  subs  = data.get("subs") or {}
                  if not token or not subs:
                      continue
                  lang = data.get("lang", "ka")
                  # Each sub entry is either station-level (legacy, no connector)
                  # or scoped to a connector type. The dict KEY is opaque; the
                  # station id + connector come from the VALUE (falling back to
                  # the key for docs written before per-connector alerts).
                  hits = []
                  for skey, meta in subs.items():
                      meta = meta if isinstance(meta, dict) else {}
                      sid  = meta.get("stationId") or skey
                      conn = meta.get("connector") or ""
                      if has_freed(sid, conn):
                          hits.append((skey, sid, conn, meta))
                  if not hits:
                      continue
                  dead = False
                  for skey, sid, conn, meta in hits:
                      s    = new_by_id[sid]
                      name = meta.get("name") or s.get("name") or "დამტენი"
                      label = f"{conn} — {name}" if conn else name
                      body = (f"{label} is now free! Grab it before someone beats you to it 🙂"
                              if lang == "en"
                              else f"{label} გათავისუფლდა! მოასწარი დატენვა სანამ სხვამ მიგასწრო 🙂")
                      try:
                          messaging.send(messaging.Message(
                              token=token,
                              notification=messaging.Notification(
                                  title="⚡ GeoCharge", body=body),
                              android=messaging.AndroidConfig(priority="high"),
                          ))
                          sent += 1
                      except messaging.UnregisteredError:
                          dead = True  # token no longer valid — drop the doc
                          break
                      except Exception as e:
                          print("  send failed:", e)
                  try:
                      if dead:
                          doc.reference.delete()
                      else:
                          # Back-tick quote the key as one literal path segment:
                          # connector types like "GB/T" / "Type 2" contain chars
                          # the field-path parser would otherwise reject.
                          doc.reference.update(
                              {f"subs.`{skey}`": firestore.DELETE_FIELD
                               for skey, _sid, _conn, _meta in hits})
                  except Exception as e:
                      print("  cleanup failed:", e)
              print(f"🔔 sent {sent} push(es)")

          # ── Load station data from the committed asset file ────────────────
          # The bundled asset ships with snapshots of the live providers for
          # offline use, so for each live provider we drop its bundled rows and
          # re-add them fresh below. This keeps the merge idempotent and avoids
          # duplicates on every run.
          with open("assets/data/chargers.json", encoding="utf-8-sig") as f:
              bundled = json.load(f)

          # ── Merge in every live provider ───────────────────────────────────
          # Only replace a provider's bundled rows when its fetch actually
          # returns data; on a transient failure or missing secret we keep the
          # last-known bundled snapshot instead of dropping the provider.
          stations = list(bundled)
          fresh_providers = set()   # providers we actually re-fetched this cycle
          for fn, pname in [(fetch_martev, "mart EV"),
                            (fetch_moveo, "MOVEO"),
                            (fetch_electrify, "Electrify Georgia"),
                            (fetch_evpower, "EV Power GE"),
                            (fetch_datene, "Da-Tene"),
                            (fetch_gadatene, "Gadatene"),
                            (fetch_ecocars, "EcoCars"),
                            (fetch_solarstation, "Solar Station"),
                            (fetch_tegeta, "Tegeta"),
                            (fetch_chargerplus, "Charger Plus"),
                            (fetch_espace, "E-Space")]:
              fresh = []
              try:
                  fresh = fn()
              except Exception as e:
                  print(f"{pname} fetch failed:", e)
              if fresh:
                  stations = [s for s in stations if s.get("provider") != pname]
                  stations += fresh
                  fresh_providers.add(pname)

          # ── Drop provider test stations ────────────────────────────────────
          # Several providers leave internal test rigs in their public API
          # (names like "TEST", "Test Location", "555 TEST GEORGIA NEW"). They
          # carry bogus data/coords and don't exist for drivers, so hide any
          # station whose name contains the standalone word "test" (any case).
          # Self-correcting: the moment a provider promotes a test rig to a real
          # station it renames it (drops "TEST"), so it reappears with no code
          # change. Word-boundary match avoids false hits like "Contest"/"Latest".
          # One central pass over the merged list => covers every provider, the
          # bundled fallback rows, and keeps test rigs out of the freed-up alerts.
          _TEST_RE = re.compile(r"\btest\b", re.IGNORECASE)
          _before = len(stations)
          stations = [s for s in stations
                      if not _TEST_RE.search(str(s.get("name") or ""))]
          _dropped = _before - len(stations)
          if _dropped:
              print(f"Dropped {_dropped} provider test station(s) by name")

          # Stamp every station with the current UTC time so the app shows
          # a meaningful "last verified" timestamp after each gist refresh.
          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          for s in stations:
              s["last_updated"] = now

          # ── Fetch the current gist so we keep any other files intact ───────
          resp = requests.get(
              f"https://api.github.com/gists/{GIST_ID}",
              headers=headers,
              timeout=30,
          )
          resp.raise_for_status()
          gist_data = resp.json()

          # ── Fire push alerts for stations that just freed up ───────────────
          # Uses the gist we just fetched as the "previous" state (it still holds
          # the last cycle's availability, since we haven't patched yet).
          try:
              f0 = (gist_data.get("files") or {}).get("chargers.json") or {}
              if f0.get("truncated") and f0.get("raw_url"):
                  old_stations = requests.get(
                      f0["raw_url"], headers=headers, timeout=30).json()
              else:
                  old_stations = json.loads(f0.get("content") or "[]")
              notify_freed(old_stations, stations, fresh_providers)
          except Exception as e:
              print("charger-free alerts skipped:", e)

          # Preserve every file in the gist except chargers.json
          files = {
              name: data
              for name, data in gist_data.get("files", {}).items()
              if name != "chargers.json"
          }

          # Replace chargers.json with the freshly timestamped data
          files["chargers.json"] = {
              "content": json.dumps(stations, ensure_ascii=False, indent=2)
          }

          # ── Patch the gist ─────────────────────────────────────────────────
          patch = requests.patch(
              f"https://api.github.com/gists/{GIST_ID}",
              headers=headers,
              json={"files": files},
              timeout=30,
          )
          patch.raise_for_status()

          print(f"✅  Updated {len(stations)} stations — last_updated = {now}")
          PYEOF
          then
            FAILS=0
          else
            rc=$?
            FAILS=$((FAILS + 1))
            echo "::warning::update iteration $i failed (exit $rc; $FAILS in a row)"
            if [ "$FAILS" -ge "$MAX_FAILS" ]; then
              echo "::error::$FAILS consecutive failures (exit $rc) — aborting so it is visible"
              echo "::endgroup::"
              exit "$rc"
            fi
          fi
          echo "::endgroup::"
          if [ "$(( $(date +%s) - START ))" -ge "$RUN_SECONDS" ]; then
            echo "Reached ${RUN_SECONDS}s of coverage — exiting so the next fire takes over."
            break
          fi
          echo "Sleeping ${SLEEP_SECONDS}s before next update…"; sleep "$SLEEP_SECONDS"
          i=$((i + 1))
          done
