name: Rebuild charger pages

# Regenerates the /damtenebi/ and /qselebi/ catalogue pages from the live gist,
# commits them, deploys to Firebase Hosting and pings IndexNow.
#
# Deliberately NOT part of update_gist.yml: that workflow loops every 3 minutes
# for ~5.5h to keep the gist fresh. Rebuilding and redeploying 64 static pages
# at that cadence would burn deploy quota for changes nobody would notice.
# Station counts move by a handful per week, so once a day is plenty.

on:
  schedule:
    # 04:00 UTC = 08:00 Tbilisi, after the overnight gist refreshes.
    - cron: '0 4 * * *'

  # Rebuild when the generator itself changes.
  push:
    branches: [main]
    paths:
      - 'tools/build-pages.mjs'
      - '.github/workflows/rebuild_charger_pages.yml'

  workflow_dispatch:

concurrency:
  group: rebuild-charger-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate pages from the live gist
        run: node tools/build-pages.mjs

      - name: Any pages actually change?
        id: diff
        run: |
          if git diff --quiet -- site/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No station changes since the last run — nothing to deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- site/ | tail -20
          fi

      - name: Commit regenerated pages
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/
          git commit -m "chore(site): refresh charger catalogue pages

          Regenerated by tools/build-pages.mjs from the live gist."
          git push

      - name: Deploy to Firebase Hosting
        if: steps.diff.outputs.changed == 'true'
        env:
          # Same service-account JSON the gist workflow uses for FCM. It needs the
          # Firebase Hosting Admin role on geocharge-f6714 for this step to pass.
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not set — skipping deploy." >&2
            exit 1
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy \
            --only hosting:geocharge-web \
            --project geocharge-f6714 \
            --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Tell IndexNow the pages moved
        if: steps.diff.outputs.changed == 'true'
        # --offline reuses the gist snapshot the generate step already cached, so
        # the pages are byte-identical to what was just deployed.
        run: node tools/build-pages.mjs --offline --ping
