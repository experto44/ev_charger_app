# Codemagic CI/CD — automated iOS build & TestFlight delivery.
# Mirrors the Android release flow: a push to `main` builds a signed iOS app
# and ships it to TestFlight (and optionally App Store review).
#
# One-time setup in the Codemagic UI (see docs/IOS_SETUP.md for the full guide):
#   1. Connect this GitHub repo.
#   2. App Store Connect API key integration named "CodemagicASCKey"
#      (Apple → App Store Connect → Users & Access → Keys). Reused across apps.
#   3. Add a secure (encrypted) variable group "geocharge_ios" containing:
#        - APP_STORE_APPLE_ID        the app's numeric Apple ID from App Store Connect
#        - GOOGLE_SERVICE_INFO_PLIST base64 of ios/Runner/GoogleService-Info.plist
#      (Marketing version comes from pubspec.yaml — no APP_VERSION needed.)
#   4. Register the bundle id `ge.geocharge.app` in App Store Connect first.

workflows:
  ios-release:
    name: iOS Release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: CodemagicASCKey

    environment:
      groups:
        - geocharge_ios
      flutter: stable
      xcode: latest
      cocoapods: default

    # ── AUTOMATIC TRIGGER DISABLED (2026-08-07) ───────────────────────────
    # iOS builds are billed per minute and five ran back-to-back on commits
    # that touch nothing shipping inside the app (firebase.json, tesla/, a
    # .md file). The `when.changeset` allow-list below did NOT stop them, and
    # that is not a bug in it: Codemagic compares the watched paths against
    # "the last successful build", so until ONE build goes green the filter
    # never engages and every push rebuilds the whole accumulated diff.
    # Those builds ran 2-8 minutes, far short of a real build+TestFlight, so
    # they were failing — which is exactly why no baseline ever got set.
    #
    # Until the build failure is fixed and one green build exists, iOS is
    # built by hand from the Codemagic UI ("Start new build"), which ignores
    # both the trigger and the changeset. Nothing here can spend money on its
    # own in the meantime.
    #
    # To restore: uncomment the block below. Do NOT restore it before a build
    # has succeeded, or the same loop starts again.
    #
    # triggering:
    #   events:
    #     - push
    #   branch_patterns:
    #     - pattern: main
    #       include: true
    #   # Several site commits often land within minutes of each other; only
    #   # the last one needs to reach TestFlight.
    #   cancel_previous_builds: true

    # Only build iOS when something that actually ships inside the app changed.
    # Without this, every push to main built an IPA — including the nightly
    # `chore(site): refresh charger catalogue pages` commit that the
    # rebuild_charger_pages workflow pushes, and every site/ or tools/ edit.
    # `includes` is an allow-list: anything not listed here never triggers a
    # build. Applies to webhook-triggered builds only — a manual build from the
    # Codemagic UI always runs, whatever changed.
    when:
      changeset:
        includes:
          - 'lib'
          - 'ios'
          - 'assets'
          - 'pubspec.yaml'
          - 'pubspec.lock'
          - 'codemagic.yaml'
        excludes:
          - '**/*.md'

    scripts:
      - name: Fetch / create signing files
        script: |
          # Creates (or reuses) the App Store distribution certificate using our
          # own private key in CERTIFICATE_PRIVATE_KEY, plus the provisioning
          # profile for this bundle id — the private key is required because Apple
          # never stores it, so the CI must supply one to own a certificate.
          keychain initialize
          app-store-connect fetch-signing-files "ge.geocharge.app" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
      - name: Restore Firebase iOS config
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > "$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"
      - name: Flutter packages
        script: |
          # Disable Swift Package Manager: google_mobile_ads is CocoaPods-only,
          # and mixing it with SPM-based plugins (webview_flutter_wkwebview) breaks
          # pod install. Force everything onto CocoaPods.
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Apply provisioning profiles to the Xcode project
        script: xcode-project use-profiles
      - name: Compute next build number from TestFlight
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          echo "BUILD_NUMBER=$(($LATEST + 1))" >> "$CM_ENV"
      - name: Build signed IPA
        script: |
          # Marketing version (build name) comes from pubspec.yaml; only the
          # build number is overridden so it always increments on TestFlight.
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true     # auto-distribute to your internal testers
        submit_to_app_store: false     # flip to true once you're ready for review
